[package]
name = "sapling-crypto"
version = "0.9.0"
authors = [
    "Sean Bowe <sean@electriccoin.co>",
    "Jack Grigg <jack@electriccoin.co>",
    "Kris Nuttycombe <kris@electriccoin.co>",
]
edition = "2021"
rust-version = "1.88"
resolver = "3"
description = "Cryptographic library for Zcash Sapling"
homepage = "https://github.com/zcash/sapling-crypto"
repository = "https://github.com/zcash/sapling-crypto"
license = "MIT OR Apache-2.0"

[package.metadata.docs.rs]
features = ["test-dependencies"]
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
ff = { version = "0.14", default-features = false }
group = "0.14"

bls12_381 = { version = "0.9", default-features = false, features = ["alloc"] }
jubjub = { version = "0.11", default-features = false, features = ["alloc"] }
redjubjub = { version = "0.9", default-features = false }
zcash_spec = "0.2"

# Boilerplate
getset = "0.1"

# No-std support
corez = { version = "0.1.1", default-features = false, features = ["alloc"] }

# Circuits
bellman = { version = "0.15", default-features = false, optional = true }
groth16 = { version = "0.2", default-features = false, optional = true }
rayon = { version = "1.5.1", optional = true }

# CSPRNG
rand = { version = "0.10", default-features = false }
rand_core = { version = "0.10", default-features = false }

# Digests
blake2b_simd = { version = "1", default-features = false }
blake2s_simd = { version = "1", default-features = false }

# Documentation
document-features = { version = "0.2", optional = true }

# Encodings
hex = { version = "0.4", default-features = false, features = ["alloc"] }

# Logging and metrics
memuse = { version = "0.2.2", default-features = false }
tracing = { version = "0.1", optional = true, default-features = false }

# Note Commitment Trees
bitvec = { version = "1", default-features = false }
incrementalmerkletree = { version = "0.9", default-features = false, features = ["legacy-api"] }

# Note encryption
zcash_note_encryption = { version = "0.5.1", features = ["pre-zip-212"] }

# Secret management
subtle = { version = "2.6", default-features = false }
zeroize = { version = "1", optional = true, default-features = false }

# Static constants
lazy_static = "1"

# Test dependencies
proptest = { version = "1", optional = true }

# ZIP 32
aes = "0.9"
fpe = { version = "0.7", default-features = false, features = ["alloc"] }
zip32 = { version = "0.3", default-features = false }


[dev-dependencies]
chacha20poly1305 = "0.11"
rand = { version = "0.10", features = ["std_rng", "sys_rng"] }
criterion = "0.5"
incrementalmerkletree = { version = "0.9", features = ["legacy-api", "test-dependencies"] }
proptest = "1"
rand_xorshift = "0.5"

[target.'cfg(unix)'.dev-dependencies]
pprof = { version = "0.15", features = ["criterion", "flamegraph"] } # MSRV 1.74

[features]
default = ["multicore", "circuit", "zeroize"]
std = [
  "corez/std",
  "dep:document-features",
  "group/wnaf-memuse",
  "redjubjub/std"
]

## Enables creation of Sapling proofs
circuit = [
  "dep:bellman",
  "dep:tracing",
  "dep:groth16",
  "bls12_381/bits",
  "bls12_381/groups",
  "bls12_381/pairings",
  "jubjub/bits",
  "std"
]

## Enables multithreading support for creating and verifying proofs.
multicore = ["bellman?/multicore", "groth16?/multicore", "dep:rayon"]

### A temporary feature flag that exposes granular APIs needed by `zcashd`. These APIs
### should not be relied upon and will be removed in a future release.
temporary-zcashd = []

## Zeroizes spending-key material on drop, and exposes `Zeroize` impls.
zeroize = ["dep:zeroize", "jubjub/zeroize", "redjubjub/zeroize", "zip32/zeroize"]

## Exposes APIs that are useful for testing, such as `proptest` strategies.
test-dependencies = [
    "incrementalmerkletree/test-dependencies",
    "dep:proptest",
    "rand/std_rng",
]

[[bench]]
name = "circuit"
harness = false

[[bench]]
name = "pedersen_hash"
harness = false

[patch.crates-io]
bellman = { git = "https://github.com/upbqdn/bellman", rev = "c2a67071e77e290a8deba50c9ba8777705d40030" }
groth16 = { git = "https://github.com/upbqdn/bellman", rev = "c2a67071e77e290a8deba50c9ba8777705d40030" }
bls12_381 = { git = "https://github.com/upbqdn/bls12_381", rev = "625ef5e3d14a3fcf83932ac979df22d4a4bbc34d" }
pairing = { git = "https://github.com/upbqdn/pairing", rev = "cb99cc74b1f5b4e6ecfb7d83db8e4261439e4a13" }
redjubjub = { git = "https://github.com/upbqdn/redjubjub", rev = "87ef6241f46c922b68119597534f0060f7f4280d" }
reddsa = { git = "https://github.com/ZcashFoundation/reddsa", rev = "6cc0415f322c199442e767b6bbb30b42469d927c" }
pasta_curves = { git = "https://github.com/upbqdn/pasta_curves", rev = "b80bd85008f73f971dc689b1a30e5551e1e957d1" }
